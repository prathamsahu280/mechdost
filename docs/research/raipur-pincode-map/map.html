<!doctype html>
<html lang="en">

    <meta charset="utf-8" />

    <title>Raipur PIN map (draft)</title>

    <style>
      :root {
        --navy: #101f34;
        --accent: #ea5728;
        --ink: #101f34;
        --muted: #5a6a7d;
        --bg: #f4f6f9;
        --card: #fff;
        --line: #d3dbe5;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      #map {
        position: absolute;
        inset: 0;
      }
      .bar {
        position: absolute;
        z-index: 1000;
        left: 12px;
        right: 12px;
        top: 12px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        pointer-events: none;
      }
      .card {
        pointer-events: auto;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 4px 16px #101f3418;
        padding: 10px 12px;
      }
      .title {
        font-weight: 800;
        font-size: 15px;
      }
      .sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }
      button {
        pointer-events: auto;
        font: inherit;
        font-weight: 700;
        border: 0;
        border-radius: 10px;
        min-height: 44px;
        padding: 0 14px;
        cursor: pointer;
      }
      .primary {
        background: #d2461a;
        color: #fff;
      }
      .ghost {
        background: var(--card);
        color: var(--ink);
        border: 1px solid var(--line);
      }
      button:focus-visible {
        outline: 3px solid var(--navy);
        outline-offset: 2px;
      }
      #result {
        position: absolute;
        z-index: 1000;
        left: 12px;
        right: 12px;
        bottom: 16px;
        pointer-events: none;
        display: flex;
        justify-content: center;
      }
      #result .card {
        max-width: 440px;
        width: 100%;
        font-size: 14px;
      }
      #result b {
        font-size: 22px;
      }
      .pinlabel {
        background: transparent;
        border: 0;
        box-shadow: none;
        font-weight: 800;
        font-size: 12px;
        color: var(--navy);
        text-shadow:
          0 0 3px #fff,
          0 0 3px #fff;
      }
      .leaflet-tooltip.pinlabel:before {
        display: none;
      }
      .legend {
        font-size: 12px;
        line-height: 1.5;
      }
    </style>
  </head>

      function inside(x, y, ring) {
        let c = false;
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
          const [xi, yi] = ring[i],
            [xj, yj] = ring[j];
          if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c;
        }
        return c;
      }
      function pinAt(lat, lng) {
        for (const f of GEO.features) {
          const g = f.geometry,
            polys = g.type === 'MultiPolygon' ? g.coordinates : [g.coordinates];
          for (const p of polys) {
            if (inside(lng, lat, p[0]) && !p.slice(1).some((h) => inside(lng, lat, h))) return f.properties;
          }
        }
        return null;
      }
      const out = document.getElementById('result');
      let me;
      function show(lat, lng, acc) {
        const hit = pinAt(lat, lng);
        if (me) map.removeLayer(me);
        me = L.circleMarker([lat, lng], {
          radius: 8,
          color: '#fff',
          weight: 3,
          fillColor: '#d2461a',
          fillOpacity: 1,

              hit.office +
              (acc ? ' · position accurate to about ' + Math.round(acc) + ' m' : '') +
              '</span>'
            : 'Outside the mapped PIN areas') +
          '</div>';
      }
      document.getElementById('locate').onclick = () => {
        if (!navigator.geolocation) {
          out.innerHTML = '<div class="card">This browser cannot share its location.</div>';
          return;

        out.innerHTML = '<div class="card">Finding you…</div>';

            map.setView([p.coords.latitude, p.coords.longitude], 15);
            show(p.coords.latitude, p.coords.longitude, p.coords.accuracy);
          },
          (e) => {
            out.innerHTML =
              '<div class="card">Could not get your location (' +
              e.message +
              '). Tap anywhere on the map instead.</div>';
          },
          { enableHighAccuracy: true, timeout: 15000 },
        );
      };
