<title>MechDost My Garage</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=DM+Sans:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap"
/>
<style>
  /* Layout: one phone column (max 460px). Navy "dashboard" hero with the live odometer, then the road strip
   (km ruler: the vehicle rides toward the next jobs), then next-up, fits shelf, service book stamps, papers, spend. */
  :root {
    --bg: #eef2f7;
    --surface: #ffffff;
    --sunken: #f5f7fa;
    --ink: #101f34;
    --muted: #536376;
    --line: #dbe2ea;
    --navy: #101f34;
    --navy-2: #1b2f4b;
    --on-navy: #ffffff;
    --on-navy-muted: #b9c6d8;
    --accent: #ea5728;
    --accent-btn: #d94a1d;
    --accent-soft: #fff0e9;
    --accent-soft-text: #bf3c12;
    --brass: #e0a526;
    --brass-text: #865800;
    --brass-soft: #fbf1da;
    --ok: #14683c;
    --ok-bg: #e8f5ed;
    --warn: #674e2d;
    --warn-bg: #fff3df;
    --bad: #b42318;
    --bad-bg: #fdecea;
    --shadow: 0 0 0 1px #101f340d, 0 1px 2px #101f340f, 0 10px 28px -18px #101f3433;
    --f-head: 'Manrope', 'Noto Sans Devanagari', system-ui, sans-serif;
    --f-body: 'DM Sans', 'Noto Sans Devanagari', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: #0a1424;
      --surface: #101d31;
      --sunken: #0d192b;
      --ink: #e8eef5;
      --muted: #a3b3c7;
      --line: #233450;
      --navy: #13233b;
      --navy-2: #1c3150;
      --on-navy: #ffffff;
      --on-navy-muted: #b9c6d8;
      --accent: #ff7a4d;
      --accent-btn: #ea5728;
      --accent-soft: #3a1f14;
      --accent-soft-text: #ffb38f;
      --brass: #e0a526;
      --brass-text: #f2c461;
      --brass-soft: #2d2311;
      --ok: #84d6a6;
      --ok-bg: #0f2a1d;
      --warn: #f1d29b;
      --warn-bg: #2d2311;
      --bad: #ff9282;
      --bad-bg: #3a1714;
      --shadow: 0 0 0 1px #ffffff0f, 0 12px 30px -16px #00000099;
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --bg: #0a1424;
    --surface: #101d31;
    --sunken: #0d192b;
    --ink: #e8eef5;
    --muted: #a3b3c7;
    --line: #233450;
    --navy: #13233b;
    --navy-2: #1c3150;
    --on-navy: #ffffff;
    --on-navy-muted: #b9c6d8;
    --accent: #ff7a4d;
    --accent-btn: #ea5728;
    --accent-soft: #3a1f14;
    --accent-soft-text: #ffb38f;
    --brass: #e0a526;
    --brass-text: #f2c461;
    --brass-soft: #2d2311;
    --ok: #84d6a6;
    --ok-bg: #0f2a1d;
    --warn: #f1d29b;
    --warn-bg: #2d2311;
    --bad: #ff9282;
    --bad-bg: #3a1714;
    --shadow: 0 0 0 1px #ffffff0f, 0 12px 30px -16px #00000099;
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 var(--f-body);
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--bg);
  }
  button,
  input,
  select {
    font: inherit;
    color: inherit;
  }
  button {
    cursor: pointer;
  }
  :focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    border-radius: 8px;
  }
  .wrap {
    max-width: 460px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px 110px;
    display: grid;
    gap: 18px;
  }
  h1,
  h2,
  h3 {
    font-family: var(--f-head);
    margin: 0;
    text-wrap: balance;
  }
  h2 {
    font-size: 18px;
    font-weight: 800;
  }
  .tnum {
    font-variant-numeric: tabular-nums;
  }
  .muted {
    color: var(--muted);
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .spread {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  /* top bar */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .top h1 {
    font-size: 24px;
    font-weight: 800;
  }
  .tools {
    display: flex;
    gap: 6px;
  }
  .pill {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    min-height: 40px;
    padding: 0 14px;
    font-weight: 700;
    font-size: 13px;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .tag.today {
    background: var(--ok-bg);
    color: var(--ok);
  }
  .tag.new {
    background: var(--brass-soft);
    color: var(--brass-text);
  }
  /* vehicle switcher */
  .switch {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px;
    scrollbar-width: none;
    margin-inline: -2px;
  }
  .switch::-webkit-scrollbar {
    display: none;
  }
  .chip {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 6px 14px 6px 8px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--surface);
    font-weight: 700;
    font-size: 13.5px;
  }
  .chip svg {
    width: 30px;
    height: 22px;
  }
  .chip[aria-pressed='true'] {
    background: var(--accent-soft);
    border-color: transparent;
    color: var(--accent-soft-text);
  }
  .chip.add {
    border-style: dashed;
    color: var(--muted);
    padding-left: 14px;
  }
  /* hero dashboard */
  .hero {
    background: radial-gradient(120% 90% at 85% 0%, var(--navy-2), var(--navy) 60%);
    color: var(--on-navy);
    border-radius: 24px;
    padding: 18px 18px 16px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 18px 36px -22px #101f3499;
  }
  .hero .name {
    font-size: 22px;
    font-weight: 800;
    line-height: 1.2;
  }
  .hero .sub {
    color: var(--on-navy-muted);
    font-size: 13.5px;
  }
  .plate {
    display: inline-flex;
    align-items: stretch;
    border-radius: 6px;
    overflow: hidden;
    border: 2px solid #101f34;
    background: #fff;
    color: #101f34;
    font: 800 15px/1 var(--f-head);
    letter-spacing: 1px;
    margin-top: 10px;
  }
  .plate .ind {
    background: #1f4fb3;
    color: #fff;
    font-size: 8px;
    letter-spacing: 0.5px;
    display: grid;
    place-items: center;
    padding: 0 5px;
    line-height: 1.1;
    text-align: center;
  }
  .plate .num {
    padding: 6px 9px;
  }
  .vehicle-art {
    display: block;
    width: 100%;
    max-width: 300px;
    height: auto;
    margin: 6px auto 0;
  }
  .odo {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    margin-top: 4px;
  }
  .odo-label {
    font-size: 12.5px;
    color: var(--on-navy-muted);
  }
  .drums {
    display: flex;
    gap: 3px;
    margin-top: 4px;
  }
  .drum {
    width: 26px;
    height: 38px;
    border-radius: 6px;
    background: #0b1626;
    border: 1px solid #ffffff1f;
    overflow: hidden;
    position: relative;
    box-shadow:
      inset 0 8px 10px -8px #000,
      inset 0 -8px 10px -8px #000;
  }
  .drum:last-child {
    background: #2a0f05;
    border-color: #ea572855;
  }
  .reel {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    display: flex;
    flex-direction: column;
    transition: transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .reel span {
    height: 38px;
    display: grid;
    place-items: center;
    font: 800 22px/1 var(--f-head);
    color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .km-unit {
    font: 700 13px var(--f-head);
    color: var(--on-navy-muted);
    margin-left: 6px;
    align-self: center;
  }
  .btn {
    min-height: 46px;
    border: 0;
    border-radius: 12px;
    padding: 0 18px;
    font-weight: 800;
    font-family: var(--f-head);
    font-size: 14.5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn.primary {
    background: var(--accent-btn);
    color: #fff;
  }
  .btn.light {
    background: #ffffff1a;
    color: #fff;
    border: 1px solid #ffffff33;
  }
  .btn.ghost {
    background: var(--sunken);
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn.block {
    width: 100%;
  }
  /* road strip */
  .road-card {
    background: var(--surface);
    border-radius: 20px;
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .road {
    position: relative;
    height: 118px;
    margin-top: 10px;
  }
  .asphalt {
    position: absolute;
    left: 0;
    right: 0;
    top: 50px;
    height: 22px;
    border-radius: 11px;
    background: var(--sunken);
    border: 1px solid var(--line);
  }
  .asphalt::after {
    content: '';
    position: absolute;
    left: 10px;
    right: 10px;
    top: 10px;
    border-top: 2px dashed var(--line);
  }
  .travelled {
    position: absolute;
    left: 0;
    top: 50px;
    height: 22px;
    border-radius: 11px;
    background: linear-gradient(90deg, var(--accent-soft), var(--accent));
    opacity: 0.9;
    transition: width 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .rider {
    position: absolute;
    top: 22px;
    transform: translateX(-50%);
    transition: left 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
    width: 44px;
    height: 30px;
  }
  .stop {
    position: absolute;
    top: 78px;
    transform: translateX(-50%);
    display: grid;
    justify-items: center;
    gap: 2px;
    background: none;
    border: 0;
    padding: 0;
    min-width: 44px;
  }
  .stop .pin {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 3px solid var(--surface);
    box-shadow: 0 0 0 2px currentColor;
    background: currentColor;
  }
  .stop .lbl {
    font-size: 11px;
    font-weight: 700;
    line-height: 1.15;
    text-align: center;
    max-width: 72px;
  }
  .stop .km {
    font-size: 10.5px;
    color: var(--muted);
  }
  .stop.ok {
    color: var(--ok);
  }
  .stop.soon {
    color: var(--brass-text);
  }
  .stop.due {
    color: var(--bad);
  }
  .scale {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  /* next up */
  .next {
    border-radius: 20px;
    padding: 16px;
    display: grid;
    gap: 12px;
    background: var(--surface);
    box-shadow: var(--shadow);
    border-left: 0;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 800;
    border-radius: 999px;
    padding: 3px 10px;
  }
  .status.due {
    background: var(--bad-bg);
    color: var(--bad);
  }
  .status.soon {
    background: var(--warn-bg);
    color: var(--warn);
  }
  .status.ok {
    background: var(--ok-bg);
    color: var(--ok);
  }
  .next h3 {
    font-size: 19px;
    font-weight: 800;
  }
  .meter {
    height: 8px;
    border-radius: 4px;
    background: var(--sunken);
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .meter i {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.8s;
  }
  /* lists */
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .shelf {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(150px, 46%);
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: thin;
  }
  .product {
    background: var(--surface);
    border-radius: 16px;
    padding: 12px;
    box-shadow: var(--shadow);
    display: grid;
    gap: 6px;
    align-content: start;
  }
  .product .art {
    height: 70px;
    border-radius: 12px;
    background: var(--sunken);
    display: grid;
    place-items: center;
  }
  .product .art svg {
    width: 48px;
    height: 48px;
  }
  .fit {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ok);
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .price {
    font: 800 16px var(--f-head);
  }
  .product .pname {
    font-weight: 700;
    font-size: 13.5px;
    line-height: 1.3;
  }
  /* service book */
  .book {
    background: var(--surface);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 6px 16px;
  }
  .entry {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px dashed var(--line);
    align-items: start;
  }
  .entry:last-child {
    border-bottom: 0;
  }
  .stamp {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 2px solid currentColor;
    display: grid;
    place-items: center;
    text-align: center;
    font: 800 10px/1.1 var(--f-head);
    transform: rotate(-8deg);
    padding: 4px;
  }
  .stamp.svc {
    color: var(--accent-soft-text);
  }
  .stamp.part {
    color: var(--ok);
  }
  .stamp.mile {
    color: var(--brass-text);
    border-style: double;
    border-width: 4px;
  }
  .entry .title {
    font-weight: 700;
  }
  .entry .meta {
    font-size: 12.5px;
    color: var(--muted);
  }
  .entry .amt {
    font: 800 14px var(--f-head);
    text-align: right;
    white-space: nowrap;
  }
  .filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .filters button {
    min-height: 36px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 0 12px;
    font-size: 13px;
    font-weight: 700;
  }
  .filters button[aria-pressed='true'] {
    background: var(--accent-soft);
    color: var(--accent-soft-text);
    border-color: transparent;
  }
  /* papers */
  .papers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .paper {
    background: var(--surface);
    border-radius: 16px;
    padding: 12px;
    box-shadow: var(--shadow);
    text-align: left;
    border: 0;
    display: grid;
    gap: 4px;
    min-height: 96px;
  }
  .paper .pk {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--muted);
  }
  .paper .days {
    font: 800 22px/1.1 var(--f-head);
  }
  .paper .when {
    font-size: 12px;
    color: var(--muted);
  }
  .paper.add .days {
    font-size: 15px;
    color: var(--accent-soft-text);
  }
  /* spend */
  .spend {
    background: var(--surface);
    border-radius: 20px;
    padding: 16px;
    box-shadow: var(--shadow);
    display: grid;
    gap: 10px;
  }
  .bar-row {
    display: grid;
    grid-template-columns: 96px 1fr auto;
    gap: 10px;
    align-items: center;
    font-size: 13px;
  }
  .bar {
    height: 10px;
    border-radius: 5px;
    background: var(--sunken);
    overflow: hidden;
  }
  .bar i {
    display: block;
    height: 100%;
    border-radius: 5px;
    transition: width 0.8s;
  }
  /* setup ring */
  .setup {
    display: flex;
    gap: 14px;
    align-items: center;
    background: var(--surface);
    border-radius: 20px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
  }
  .ring {
    width: 58px;
    height: 58px;
    flex: 0 0 auto;
  }
  .setup ul {
    margin: 6px 0 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
    font-size: 12.5px;
  }
  .setup li::before {
    content: '○ ';
    color: var(--muted);
  }
  .setup li.done {
    color: var(--muted);
    text-decoration: line-through;
  }
  .setup li.done::before {
    content: '✓ ';
    color: var(--ok);
    text-decoration: none;
    display: inline-block;
  }
  /* dock */
  .dock {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    background: var(--surface);
    box-shadow:
      0 -1px 0 var(--line),
      0 -8px 20px -16px #101f3433;
    padding: 6px max(10px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px))
      max(10px, env(safe-area-inset-right, 0px));
  }
  .dock nav {
    max-width: 460px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
  }
  .dock a {
    display: grid;
    justify-items: center;
    gap: 2px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
    text-decoration: none;
    padding: 6px 0;
    border-radius: 12px;
  }
  .dock a svg {
    width: 22px;
    height: 22px;
  }
  .dock a[aria-current='page'] {
    color: var(--accent-soft-text);
  }
  .dock a[aria-current='page'] .ico {
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 2px 14px;
  }
  /* sheet */
  .scrim {
    position: fixed;
    inset: 0;
    background: #0a142499;
    z-index: 30;
    display: grid;
    align-items: end;
    justify-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .scrim.open {
    opacity: 1;
    pointer-events: auto;
  }
  .sheet {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border-radius: 22px 22px 0 0;
    padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translateY(24px);
    transition: transform 0.25s;
    max-height: 88vh;
    overflow: auto;
    overscroll-behavior: contain;
    display: grid;
    gap: 14px;
  }
  .scrim.open .sheet {
    transform: none;
  }
  .sheet h3 {
    font-size: 20px;
    font-weight: 800;
  }
  .field {
    display: grid;
    gap: 6px;
  }
  .field label {
    font-weight: 700;
    font-size: 13.5px;
  }
  .field input,
  .field select {
    min-height: 48px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--sunken);
    padding: 0 12px;
  }
  .choices {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .choices button {
    min-height: 44px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--sunken);
    padding: 0 14px;
    font-weight: 700;
  }
  .choices button[aria-pressed='true'] {
    background: var(--accent-soft);
    color: var(--accent-soft-text);
    border-color: var(--accent);
  }
  .steps {
    display: flex;
    gap: 6px;

        );
        const yr = sheet.querySelector('#yr');
        if (yr) yr.onchange = () => (d.year = Number(yr.value));
        const rg = sheet.querySelector('#rg');
        if (rg) rg.oninput = () => (d.reg = rg.value.toUpperCase());
        const bk = sheet.querySelector('#bk');
        if (bk)
          bk.onclick = () => {
            step--;
            draw();
          };
        sheet.querySelector('#nx').onclick = () => {
          if (step < 3) {
            step++;
            draw();
            return;
          }
          const id = 'v' + Date.now();
          S.vehicles.push({
            id,
            type: d.type,
            fuel: d.fuel,
            make: d.make,
            model: d.model,
            variant: null,
            year: d.year,
            reg: d.reg.trim() || null,
            km: 0,
            kmAt: '2026-11-28',
            last: {
              oil: [0, '2026-11-28'],
              service: [0, '2026-11-28'],
              tyres: [0, '2026-11-28'],
              battery: [0, '2026-11-28'],
            },
            papers: { insurance: null, puc: null, rc: null, licence: null },
            reminders: false,
            log: [],
            spend: [
              ['services', 0],
              ['parts', 0],
              ['tyres', 0],
              ['battery', 0],
            ],
          });
          S.active = id;
          save();
          closeSheet();
          render();
          document.getElementById('artbox').firstElementChild.classList.add('drive-in');
          toast(L.added(d.model));
        };
        sheet.querySelector('#nx').focus();
      };
      openSheet('', draw);
    }

    /* ---------- events ---------- */
    document.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.close !== undefined) return closeSheet();
      if (b.dataset.veh) {
        const prev = S.active;
        S.active = b.dataset.veh;
        save();
        render();
        if (prev !== S.active) document.getElementById('artbox').firstElementChild.classList.add('drive-in');
        return;
      }
      if (b.dataset.job) return jobSheet(b.dataset.job);
      if (b.dataset.paper) return paperSheet(b.dataset.paper);
      if (b.dataset.f) {
        S.filter = b.dataset.f;
        save();
        render();
        return;
      }
      if (b.dataset.act) {
        closeSheet();
        toast(
          b.dataset.act === 'book'
            ? S.lang === 'hi'
              ? 'वर्कशॉप खोज खुलती है (आज काम करता है)'
              : 'Opens Find Workshops with this vehicle (works today)'
            : S.lang === 'hi'
              ? 'शॉप इस गाड़ी के फिट फ़िल्टर के साथ खुलती है'
              : 'Opens Shop filtered to parts that fit (works today)',
        );
        return;
      }
      if (b.id === 'upd') return kmSheet();
      if (b.id === 'add') return addSheet();
      if (b.id === 'lang') {
        S.lang = S.lang === 'en' ? 'hi' : 'en';
        save();
        render();
        return;
      }
      if (b.id === 'theme') {
        const r = document.documentElement;
        const dark = r.dataset.theme
          ? r.dataset.theme === 'dark'
          : matchMedia('(prefers-color-scheme: dark)').matches;
        r.dataset.theme = dark ? 'light' : 'dark';
        return;
      }
    });
    render();
  })();
</script>
