# Nightly UI state audit (docs/qa/ui-state-checklist.md, docs/research/ui-testing-gap-2026-11-14.md): every
# checklist item (~1,700 Playwright tests: widths 320-1920, themes, languages, stored states, hover/focus sweeps,
# geometry assertions) against a demo-mode production build. The per-push subset runs in ci.yml (e2e-demo).
# The run never commits: the ticked checklist, the JSON report and the failure screenshots are uploaded as an
# artifact for triage (runbook docs/runbooks/ui-test-catalogue.md § 9).
# Supply-chain rules as in ci.yml: actions pinned by full commit SHA, read-only token, frozen lockfile.
name: UI state audit (nightly)

on:
  schedule:
    # 02:00 IST.
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Checklist id prefixes to run (comma-separated, e.g. SHOP-,STEP-); empty = all'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ui-state-audit
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  audit:
    name: UI state audit (full)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build the web (demo data)
        run: pnpm --filter @mechdost/web build

      - name: Install Chromium for Playwright
        run: pnpm --filter @mechdost/web exec playwright install --with-deps chromium

      - name: Playwright (every checklist item)
        id: audit
        working-directory: apps/web
        env:
          STATE_AUDIT_ONLY: ${{ inputs.only }}
          STATE_AUDIT_REPORT: test-results/state-audit-report.json
        run: pnpm exec playwright test -c playwright.state-audit.config.ts
        continue-on-error: true

      - name: Tick the checklist from the report
        if: always()
        run: node apps/web/scripts/state-audit-tick.mjs apps/web/test-results/state-audit-report.json

      - name: Upload checklist, report and screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ui-state-audit
          retention-days: 14
          path: |
            docs/qa/ui-state-checklist.md
            apps/web/test-results/state-audit-report.json
            apps/web/test-results/state-audit/**/*.png

      - name: Fail when items failed
        if: steps.audit.outcome == 'failure'
        run: exit 1
