# Continuous deployment (docs/runbooks/deploy.md, design docs/superpowers/specs/2026-11-13-docker-vps-deploy-design.md).
# After CI passes on main: build the web + API images, push them to GHCR, then update the stack on the AWS server
# over SSH (docker compose pull + up --wait). Manual run: Actions → Deploy → Run workflow (optionally a commit SHA,
# which is also how to roll back).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch to deploy (default main)
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/prathamsahu280/mechdost-web
  API_IMAGE: ghcr.io/prathamsahu280/mechdost-api

jobs:
  images:
    # Only a green CI run started by a push to main of this repository (never a fork or a PR run): the deploy
    # key and registry token must not run on untrusted code (security review 2026-11-13).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}
          persist-credentials: false
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.sha.outputs.sha }}
            ${{ env.API_IMAGE }}:main
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build and push the website image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          provenance: false
          # Public settings compiled into the browser code (repository variables, never secrets).
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_DATA_MODE=${{ vars.NEXT_PUBLIC_DATA_MODE }}
            NEXT_PUBLIC_AUTH_MODE=${{ vars.NEXT_PUBLIC_AUTH_MODE }}
            NEXT_PUBLIC_MAPTILER_KEY=${{ vars.NEXT_PUBLIC_MAPTILER_KEY }}
            NEXT_PUBLIC_USTAAD_MEDIA_ORIGINS=${{ vars.NEXT_PUBLIC_USTAAD_MEDIA_ORIGINS }}
            NEXT_PUBLIC_SATELLITE_TILES=${{ vars.NEXT_PUBLIC_SATELLITE_TILES }}
            NEXT_PUBLIC_SATELLITE_ATTRIBUTION=${{ vars.NEXT_PUBLIC_SATELLITE_ATTRIBUTION }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_RELEASE=${{ steps.sha.outputs.sha }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=production
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT_WEB=${{ vars.SENTRY_PROJECT_WEB }}
            SENTRY_URL=${{ vars.SENTRY_URL || 'https://de.sentry.io' }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          # Source-map upload to Sentry (EU) inside the build, only when this secret is set; it is mounted for that
          # one step and never stored in the image (apps/web/Dockerfile, docs/runbooks/monitoring.md).
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.sha.outputs.sha }}
            ${{ env.WEB_IMAGE }}:main
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: images
    # Off until the server is set up (repository variable DEPLOY_ENABLED=true, docs/runbooks/deploy.md § First-time setup).
    if: vars.DEPLOY_ENABLED == 'true'
    # Deploy secrets live in the protected `production` environment, which only accepts the main branch.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.images.outputs.sha }}
          persist-credentials: false
      - name: SSH key and pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Update the stack on the server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ needs.images.outputs.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh_() { ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "$SSH_USER@$HOST" "$@"; }
          ssh_ 'test -f /opt/mechdost/.env' \
            || { echo "::error::/opt/mechdost/.env is missing on the server (docs/runbooks/deploy.md § Server settings)"; exit 1; }
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            deploy/compose.yml deploy/Caddyfile deploy/supabase-ca-2021.crt deploy/set-env.sh "$SSH_USER@$HOST:/opt/mechdost/"
          printf '%s' "$GHCR_TOKEN" | ssh_ "docker login ghcr.io -u '$GHCR_USER' --password-stdin" >/dev/null
          # IMAGE_TAG lives in .env (one line, replaced on every deploy) so manual `docker compose` commands work.
          # Disk (incident 2026-11-15, "no space left on device"): every deploy left its tagged images behind. Remove
          # every image no container uses before the pull (room for the new layers; the running stack keeps its own)
          # and again after the stack is up (the previous release's images). Older releases stay in GHCR for a rollback.
          ssh_ "cd /opt/mechdost && df -h / | tail -1 && docker image prune -af >/dev/null \
            && sed -i '/^IMAGE_TAG=/d' .env && echo 'IMAGE_TAG=$TAG' >> .env && rm -f .image-tag \
            && docker compose pull --quiet \
            && docker compose up -d --wait --wait-timeout 120 --remove-orphans; rc=\$?; \
            docker logout ghcr.io >/dev/null; docker image prune -af >/dev/null; df -h / | tail -1; \
            docker compose ps; exit \$rc"
      # `up --wait` counts a container without a healthcheck as up the moment it starts; the worker crash-looped after
      # a deploy that went green (2026-11-16, duplicate `createRequire` in the bundle). Check again after it has had
      # time to fail: every service running, and the worker logged `worker_started`.
      - name: Stack stays up (worker included)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh_() { ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "$SSH_USER@$HOST" "$@"; }
          sleep 45
          ssh_ 'cd /opt/mechdost && docker compose ps --all --format "{{.Service}} {{.State}} {{.Status}}"'
          bad=$(ssh_ 'cd /opt/mechdost && docker compose ps --all --format "{{.Service}} {{.State}}"' | grep -v ' running$' || true)
          if [ -n "$bad" ]; then
            echo "::error::not running after 45 s: $bad"
            # Public repo, public Actions logs: event names only, never log lines (security review 2026-11-16).
            ssh_ 'cd /opt/mechdost && docker compose logs --tail 200 worker' | grep -oE '"message":"[a-z_]+"' | sort | uniq -c || true
            echo 'Read the full log on the server: docker compose logs --tail 100 worker'
            exit 1
          fi
          if ! ssh_ 'cd /opt/mechdost && docker compose logs --since 5m worker' | grep -q worker_started; then
            echo '::error::the worker never logged worker_started'
            # Public repo, public Actions logs: event names only, never log lines (security review 2026-11-16).
            ssh_ 'cd /opt/mechdost && docker compose logs --tail 200 worker' | grep -oE '"message":"[a-z_]+"' | sort | uniq -c || true
            echo 'Read the full log on the server: docker compose logs --tail 100 worker'
            exit 1
          fi
      - name: Public check (informational until DNS points at the server)
        continue-on-error: true
        run: |
          curl -fsS -o /dev/null -w 'https://mechdost.com %{http_code}\n' --max-time 20 https://mechdost.com/
      # A new web container starts with an empty page cache, so the first visit to each shop and product page is a
      # full render (spec 16, budget incident 2026-11-22). Visit them once, slowly (GET only, one page a second,
      # inside the API's rate limit, 8 minutes at most) so customers and crawlers meet warm pages.
      - name: Warm the page cache (never fails the deploy)
        continue-on-error: true
        timeout-minutes: 10
        run: node apps/web/scripts/warm-cache.mjs https://mechdost.com --max-seconds 480
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
