# Quality gates on every push and pull request (CLAUDE.md hard rules 4, 5 and 14).
# Supply-chain rules (docs/research/security-vulnerabilities.md): third-party actions pinned by full commit SHA
# (tag in the comment), read-only token, credentials not persisted, frozen lockfile, pnpm's install-script
# allow-list and 3-day release age from pnpm-workspace.yaml. Unit tests run on PGlite: no secrets needed.
# e2e, Lighthouse CI and the visual suite join here once the preview deploy exists (Vercel, blocked on the account).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Format, types, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: Typecheck, lint (zero warnings), unit tests
        run: pnpm exec turbo run typecheck lint test --concurrency=2
