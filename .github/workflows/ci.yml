# Quality gates on every push and pull request (CLAUDE.md hard rules 4, 5 and 14).
# Supply-chain rules (docs/research/security-vulnerabilities.md): third-party actions pinned by full commit SHA
# (tag in the comment), read-only token, credentials not persisted, frozen lockfile, pnpm's install-script
# allow-list and 3-day release age from pnpm-workspace.yaml. Unit tests run on PGlite: no secrets needed.
# The demo-mode browser suites run against a local production build (`next start`), so they need no deploy;
# Lighthouse CI and the visual suite join once the preview deploy exists (Vercel, blocked on the account).
# Node comes from .nvmrc (the runtime Cloud Run uses), never a separate number here (review 2026-11-11, T7).
name: CI

# Docs-only changes (Markdown anywhere, docs/) skip CI (user 2026-11-15): they cannot break a build, a docs push used to
# cancel the running code CI (concurrency group), and every run costs private-repo Actions minutes. No deploy follows.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Format, types, lint, unit tests
    runs-on: ubuntu-latest
    # 20 → 30 (2026-11-28): run 642ea842 passed every test and was cut off in the build step at 20:14 on a slow runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: Typecheck, lint (zero warnings), unit tests
        run: pnpm exec turbo run typecheck lint test --concurrency=2

      # Build-only failures (server/client boundary, prerender) pass typecheck and tests (learnings L26, T30).
      - name: Production build
        run: pnpm exec turbo run build --concurrency=2

      # Report-only for now: a fix may need a release older than the 3-day minimum age (Q67).
      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level=high
        continue-on-error: true

  # The deploy builds these images only after CI passes, so a broken Dockerfile used to surface as a failed
  # deploy (2026-11-14: a literal "\n" in an ENV continuation). Built here without pushing, for every change.
  # Reads the deploy's layer cache but never writes it (a pull request cannot change what production builds from).
  images:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [web, api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the ${{ matrix.image }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: false
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          # The same public settings as the deploy (repository variables, never secrets), so CI builds what
          # production builds. The API image declares none of these and ignores them.
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_DATA_MODE=${{ vars.NEXT_PUBLIC_DATA_MODE }}
            NEXT_PUBLIC_AUTH_MODE=${{ vars.NEXT_PUBLIC_AUTH_MODE }}
            NEXT_PUBLIC_MAPTILER_KEY=${{ vars.NEXT_PUBLIC_MAPTILER_KEY }}
            NEXT_PUBLIC_USTAAD_MEDIA_ORIGINS=${{ vars.NEXT_PUBLIC_USTAAD_MEDIA_ORIGINS }}
            NEXT_PUBLIC_SATELLITE_TILES=${{ vars.NEXT_PUBLIC_SATELLITE_TILES }}
            NEXT_PUBLIC_SATELLITE_ATTRIBUTION=${{ vars.NEXT_PUBLIC_SATELLITE_ATTRIBUTION }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}

  # The launch configuration (real sign-in, data from the API) builds differently from the demo build: pages that
  # render without an intl provider or read the locale from the wrong place pass the demo build and fail here
  # (2026-11-15: the wishlist heart broke prerendering of the home page only in this mode; Q171). Build only, no
  # deploy, no secrets: the Firebase values are public, fake audit values (same as state-audit-api-build.mjs).
  web-real-mode:
    name: Web build (real sign-in + API data)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build the web (NEXT_PUBLIC_AUTH_MODE=firebase, NEXT_PUBLIC_DATA_MODE=api)
        env:
          NEXT_PUBLIC_AUTH_MODE: firebase
          NEXT_PUBLIC_DATA_MODE: api
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4100
          NEXT_PUBLIC_FIREBASE_API_KEY: audit-fake-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: audit.invalid
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-audit
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:audit'
          NEXT_PUBLIC_APP_URL: http://localhost:3101
        run: pnpm --filter @mechdost/web build

  e2e-demo:
    name: Browser suites (demo mode)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build the web (demo data)
        run: pnpm --filter @mechdost/web build

      - name: Install Chromium for Playwright
        run: pnpm --filter @mechdost/web exec playwright install --with-deps chromium

      # Shell + demo flows (incl. axe) and the Hindi coverage gate (hard rule 10).
      - name: Playwright
        run: pnpm --filter @mechdost/web exec playwright test e2e/shell.spec.ts e2e/demo-flows.spec.ts e2e/hindi-coverage.spec.ts

      # UI state audit, per-push subset (the `core` items of docs/qa/ui-state-checklist.md, ~5 min); the full
      # workflow runs every item. Bugs already filed (e2e/state-audit/known-issues.ts) are annotations here.
      # Report-only until the first full run is triaged (docs/questions-for-user.md Q101), then blocking.
      - name: UI state audit (core subset)
        working-directory: apps/web
        env:
          STATE_AUDIT_TIER: core
          STATE_AUDIT_KNOWN: allow
        run: pnpm exec playwright test -c playwright.state-audit.config.ts
        continue-on-error: true

      # Product-page JS budget (spec 16, hard rule 6): < 180 KB gzip.
      - name: JS budget
        working-directory: apps/web
        run: |
          pnpm exec next start --port 3100 &
          for i in $(seq 1 60); do curl -sf http://localhost:3100 >/dev/null && break; sleep 1; done
          node scripts/measure-js.mjs http://localhost:3100
